<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLBB Draft Predictor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>MLBB Draft Predictor</h1>

    <section class="rec-bans">
      <h3>Recommended bans</h3>
      <div id="rec-bans" class="rec-bans-list"></div>
    </section>

    <section class="team team-red">
      <h2>Red Team</h2>
      <div class="slots bans" data-team="redBan"></div>
      <div class="slots" data-team="red"></div>
    </section>

    <div class="vs">VS</div>

    <section class="team team-blue">
      <div class="slots" data-team="blue"></div>
      <div class="slots bans" data-team="blueBan"></div>
      <h2>Blue Team</h2>
    </section>

    <div class="actions">
      <button id="reset" class="btn btn-ghost" type="button">Reset</button>
      <button id="analyse" class="btn btn-primary" type="button" disabled>Analyse</button>
    </div>
    <p id="hint" class="hint">Pick all 10 heroes to analyse the draft.</p>
    <div id="result" class="result" hidden></div>

    <form id="log-game" class="log-game" hidden>
      <h3>Log this game</h3>
      <div class="log-row">
        <label>Winner
          <select name="winner" required>
            <option value="">—</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
          </select>
        </label>
        <label>Rank <input name="rank" placeholder="e.g. Mythic"></label>
        <label>Minutes <input name="duration_min" type="number" min="1" max="60"></label>
      </div>
      <label>Why did they win?
        <textarea name="reasoning" rows="3" placeholder="e.g. Red had no answer to Sun split pushing; Karrie melted their two tanks late."></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Save game</button>
      <p id="log-status" class="hint"></p>
    </form>
    <p class="footer-links"><a href="admin.html">Backoffice</a></p>
  </main>

  <dialog id="picker" class="picker">
    <div class="picker-head">
      <h3 id="picker-title">Choose a hero</h3>
      <input id="search" type="search" placeholder="Search heroes…" autocomplete="off">
      <button id="clear-slot" class="btn btn-ghost" type="button">Clear slot</button>
      <button id="close-picker" class="btn btn-ghost" type="button" aria-label="Close">✕</button>
    </div>
    <div id="hero-grid" class="hero-grid"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="heroes.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="data/store.js"></script>
  <script src="app.js"></script>
</body>
</html>
